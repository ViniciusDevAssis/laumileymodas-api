spring:
  application:
    name: laumiley-modas-api
  datasource:
    url: ${LAUMILEY_DB}
    username: ${AIVEN_DB_USER}
    password: ${AIVEN_DB_PASS}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${LAUMILEY_MEDIA_MAX_FILE_SIZE:10MB}
      max-request-size: ${LAUMILEY_MEDIA_MAX_REQUEST_SIZE:50MB}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${LAUMILEY_OAUTH_CLIENT_ID}
            client-secret: ${LAUMILEY_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/v1/auth/google/callback"
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

laumiley:
  frontend:
    allowed-origins: ${LAUMILEY_FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
    auth-success-url: ${LAUMILEY_FRONTEND_AUTH_SUCCESS_URL:http://localhost:3000/auth/google/success}
    registration-url: ${LAUMILEY_FRONTEND_REGISTRATION_URL:http://localhost:3000/auth/google/complete-registration}
    auth-error-url: ${LAUMILEY_FRONTEND_AUTH_ERROR_URL:http://localhost:3000/auth/google/error}
  security:
    admin:
      google-sub: ${LAUMILEY_ADMIN_GOOGLE_SUB:}
      google-email: ${LAUMILEY_ADMIN_GOOGLE_EMAIL:}
    jwt:
      issuer: ${LAUMILEY_JWT_ISSUER:laumiley-modas-api}
      access-audience: ${LAUMILEY_JWT_ACCESS_AUDIENCE:laumiley-api}
      refresh-audience: ${LAUMILEY_JWT_REFRESH_AUDIENCE:laumiley-refresh}
      access-token-ttl: ${LAUMILEY_JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${LAUMILEY_JWT_REFRESH_TOKEN_TTL:30d}
      private-key: ${LAUMILEY_JWT_PRIVATE_KEY:}
      public-key: ${LAUMILEY_JWT_PUBLIC_KEY:}
    csrf:
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
    refresh-cookie:
      name: LAUMILEY_REFRESH
      path: /api/v1/auth
      same-site: ${LAUMILEY_COOKIE_SAME_SITE:Lax}
      secure: ${LAUMILEY_COOKIE_SECURE:false}
      http-only: true
    oauth-handoff:
      cookie-name: LAUMILEY_OAUTH_HANDOFF
      cookie-path: /api/v1/auth/google
      ttl: ${LAUMILEY_OAUTH_HANDOFF_TTL:10m}
      same-site: ${LAUMILEY_COOKIE_SAME_SITE:Lax}
      secure: ${LAUMILEY_COOKIE_SECURE:false}
      http-only: true
      encryption-key: ${LAUMILEY_OAUTH_HANDOFF_ENCRYPTION_KEY:}
    authentication-rate-limit:
      max-failed-attempts: ${LAUMILEY_AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LAUMILEY_AUTH_RATE_LIMIT_WINDOW:15m}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  media:
    allowed-content-types: ${LAUMILEY_MEDIA_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
  whatsapp:
    number: ${LAUMILEY_WHATSAPP_NUMBER:}
    message-template: ${LAUMILEY_WHATSAPP_MESSAGE_TEMPLATE:Olá! Tenho interesse no produto {productName} (código {productId}).}
