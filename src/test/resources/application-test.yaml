spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret

laumiley:
  frontend:
    allowed-origins: http://localhost:3000
    auth-success-url: http://localhost:3000/auth/google/success
    registration-url: http://localhost:3000/auth/google/complete-registration
    auth-error-url: http://localhost:3000/auth/google/error
  security:
    admin:
      google-sub: test-admin-sub
    jwt:
      secret: test-secret-with-at-least-256-bits-for-hmac-validation
      issuer: laumiley-modas-api-test
      audience: laumiley-api-test
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cookies:
      secure: false
      same-site: Lax
    rate-limit:
      max-failures: 5
      window: 15m
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
  whatsapp:
    number: "5511999999999"
