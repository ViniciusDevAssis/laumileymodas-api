openapi: 3.1.0
info:
  title: Laumiley Modas API
  version: 1.0.0
  description: |
    Contrato da V1 comercial. Recursos de negócio usam HAL. Respostas de autenticação,
    redirecionamentos e erros usam JSON/HTTP convencional. A venda permanece no WhatsApp.
servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento

tags:
  - name: Auth
  - name: Customers
  - name: Catalog
  - name: Interests
  - name: Admin Catalog
  - name: CRM

paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Materializa ou renova o cookie XSRF-TOKEN
      operationId: getCsrfToken
      responses:
        '204':
          description: Cookie XSRF-TOKEN disponibilizado; nenhuma autenticação ou credencial é emitida
          headers:
            Set-Cookie:
              schema: { type: string }

  /customers:
    post:
      tags: [Customers]
      summary: Cadastra um cliente com e-mail e senha
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRegistrationRequest' }
      responses:
        '201':
          description: Cliente criado sempre com papel CLIENT
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/CustomerRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica cliente por e-mail e senha
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token no corpo e refresh token opaco em cookie HttpOnly
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o refresh token e emite novo access token
      operationId: refresh
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Tokens rotacionados
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga o refresh token e expira seu cookie
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Logout concluído
          headers:
            Set-Cookie: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/google/client:
    get:
      tags: [Auth]
      summary: Inicia OIDC Google com intenção CLIENT protegida
      operationId: startGoogleClientLogin
      responses:
        '302': { $ref: '#/components/responses/OAuthRedirect' }

  /auth/google/admin:
    get:
      tags: [Auth]
      summary: Inicia OIDC Google com intenção ADMIN protegida
      operationId: startGoogleAdminLogin
      responses:
        '302': { $ref: '#/components/responses/OAuthRedirect' }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback único do Google OIDC
      operationId: googleCallback
      description: |
        Valida state, identidade Google e intenção. Cria handoff opaco de uso único em cookie
        HttpOnly e redireciona somente para uma URL de frontend configurada. Nunca retorna tokens
        na URL nem faz account linking apenas por e-mail.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redireciona para sucesso, conclusão de cadastro ou erro no frontend
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie: { schema: { type: string } }

  /auth/google/exchange:
    post:
      tags: [Auth]
      summary: Consome handoff de uma Account Google já existente
      operationId: exchangeGoogleHandoff
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      security:
        - oauthHandoffCookie: []
      responses:
        '200':
          description: Handoff consumido, access token emitido e refresh configurado
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/google/customers:
    post:
      tags: [Auth]
      summary: Conclui cadastro de novo cliente Google e consome o handoff
      operationId: completeGoogleCustomerRegistration
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      security:
        - oauthHandoffCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCustomerCompletionRequest' }
      responses:
        '201':
          description: Account e Customer criados; tokens da aplicação emitidos
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/me/proactive-contact-consent:
    get:
      tags: [Customers]
      summary: Consulta o consentimento do cliente autenticado
      operationId: getOwnContactConsent
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estado atual
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ConsentRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Customers]
      summary: Substitui o consentimento do cliente autenticado
      operationId: replaceOwnContactConsent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRequest' }
      responses:
        '200':
          description: Estado desejado aplicado de forma idempotente
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ConsentRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products:
    get:
      tags: [Catalog]
      summary: Lista produtos ativos do catálogo público
      operationId: listPublicProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página HAL; pode estar vazia
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedProducts' }

  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Consulta detalhes de produto ativo
      operationId: getPublicProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produto com todas as imagens ordenadas
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductRepresentation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/interests:
    post:
      tags: [Interests]
      summary: Confirma interesse e cria o acompanhamento automático
      operationId: createInterest
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IdempotencyKey'
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Interest, Reminder e ContactRecord PENDING criados exatamente uma vez
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/InterestRepresentation' }
        '200':
          description: Repetição idempotente devolve o resultado já existente
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/InterestRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories:
    get:
      tags: [Admin Catalog]
      summary: Lista categorias para administração
      operationId: listCategories
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categorias
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/CategoryCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Catalog]
      summary: Cria categoria
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Categoria criada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/CategoryRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{categoryId}:
    put:
      tags: [Admin Catalog]
      summary: Substitui os dados editáveis da categoria
      operationId: replaceCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/CategoryRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products:
    get:
      tags: [Admin Catalog]
      summary: Lista produtos ativos e inativos para gestão
      operationId: listAdminProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Página de produtos
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedProducts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Catalog]
      summary: Cria produto com uma ou mais imagens
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, images]
              properties:
                metadata: { $ref: '#/components/schemas/ProductCreateRequest' }
                images:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
            encoding:
              metadata: { contentType: application/json }
      responses:
        '201':
          description: Produto e referências das imagens criados
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/products/{productId}:
    get:
      tags: [Admin Catalog]
      summary: Consulta produto para gestão
      operationId: getAdminProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Produto ativo ou inativo
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin Catalog]
      summary: Substitui nome, descrição e categoria do produto
      operationId: replaceProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductReplaceRequest' }
      responses:
        '200':
          description: Produto atualizado
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin Catalog]
      summary: Altera o status do produto
      operationId: patchProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProductStatusPatch' }
      responses:
        '200':
          description: Status alterado preservando invariantes de imagens
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/products/{productId}/images:
    post:
      tags: [Admin Catalog]
      summary: Adiciona imagem ao produto
      operationId: addProductImage
      parameters:
        - $ref: '#/components/parameters/ProductId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                primary: { type: boolean, default: false }
                displayOrder: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Imagem adicionada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductImageRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/products/{productId}/images/{imageId}:
    patch:
      tags: [Admin Catalog]
      summary: Altera imagem principal ou ordem de exibição
      operationId: patchProductImage
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ImageId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProductImagePatch' }
      responses:
        '200':
          description: Imagem atualizada
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ProductImageRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Admin Catalog]
      summary: Remove imagem quando as invariantes do produto permitem
      operationId: deleteProductImage
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ImageId'
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Imagem removida local e externamente }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/customers:
    get:
      tags: [CRM]
      summary: Pesquisa a base de clientes
      operationId: searchCustomers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: query
          in: query
          description: Nome, e-mail, telefone ou código
          schema: { type: string, maxLength: 200 }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Página de clientes
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedCustomers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/customers/{customerId}:
    get:
      tags: [CRM]
      summary: Consulta o contexto comercial do cliente
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cliente e elegibilidade atual para contato proativo
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/CustomerRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/customers/{customerId}/interests:
    get:
      tags: [CRM]
      summary: Lista interesses do cliente
      operationId: listCustomerInterests
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Interesses e produtos correspondentes
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedInterests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/customers/{customerId}/contact-records:
    get:
      tags: [CRM]
      summary: Lista registros pendentes e contatos concluídos do cliente
      operationId: listCustomerContactRecords
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/FollowUpStatus' }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Histórico distinguindo pendentes de concluídos
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedContactRecords' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [CRM]
      summary: Registra contato manual já realizado
      operationId: createManualContactRecord
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualContactRequest' }
      responses:
        '201':
          description: Contato concluído incluído no histórico
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ContactRecordRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/contact-records/{contactRecordId}:
    get:
      tags: [CRM]
      summary: Consulta registro de contato
      operationId: getContactRecord
      parameters:
        - $ref: '#/components/parameters/ContactRecordId'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registro pendente ou concluído
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ContactRecordRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [CRM]
      summary: Completa ContactRecord pendente e conclui o Reminder correspondente
      operationId: completeContactRecord
      parameters:
        - $ref: '#/components/parameters/ContactRecordId'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CompleteContactRecordRequest' }
      responses:
        '200':
          description: ContactRecord e Reminder concluídos na mesma transação
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ContactRecordRepresentation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/reminders:
    get:
      tags: [CRM]
      summary: Lista lembretes automáticos pendentes
      operationId: listPendingReminders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: overdue
          in: query
          schema: { type: boolean }
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lembretes com indicador de vencimento derivado
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/PagedReminders' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reminders/{reminderId}:
    get:
      tags: [CRM]
      summary: Consulta lembrete automático
      operationId: getReminder
      parameters:
        - $ref: '#/components/parameters/ReminderId'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Não oferece operação de conclusão independente
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/ReminderRepresentation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: LAUMILEY_REFRESH
    oauthHandoffCookie:
      type: apiKey
      in: cookie
      name: LAUMILEY_OAUTH_HANDOFF

  headers:
    Location:
      description: URI do recurso criado
      schema: { type: string, format: uri-reference }

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactRecordId:
      name: contactRecordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }

  responses:
    OAuthRedirect:
      description: Redirecionamento para autorização Google
      headers:
        Location: { schema: { type: string, format: uri } }
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Unauthorized:
      description: Autenticação ausente ou inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Forbidden:
      description: Operação não permitida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    NotFound:
      description: Recurso inexistente ou inacessível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Conflict:
      description: Conflito de unicidade, estado ou idempotência
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    UnprocessableEntity:
      description: Regra de negócio impede a mudança solicitada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    TooManyRequests:
      description: Limite local de tentativas excedido
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    FollowUpStatus:
      type: string
      enum: [PENDING, COMPLETED]
    Role:
      type: string
      enum: [CLIENT, ADMIN]

    Link:
      type: object
      required: [href]
      properties:
        href: { type: string }
        templated: { type: boolean }
    Links:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Link'
    PageMetadata:
      type: object
      required: [size, totalElements, totalPages, number]
      properties:
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }

    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password, whatsappPhone]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 200, writeOnly: true }
        whatsappPhone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
    GoogleCustomerCompletionRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, whatsappPhone]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        whatsappPhone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, role]
      properties:
        accessToken: { type: string, writeOnly: true }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos }
        role: { $ref: '#/components/schemas/Role' }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [authorized]
      properties:
        authorized: { type: boolean }
    ConsentRepresentation:
      type: object
      required: [authorized, _links]
      properties:
        authorized: { type: boolean }
        changedAt: { type: [string, 'null'], format: date-time }
        _links: { $ref: '#/components/schemas/Links' }

    CustomerRepresentation:
      type: object
      required: [id, firstName, lastName, email, whatsappPhone, proactiveContactAuthorized, _links]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        whatsappPhone: { type: string }
        proactiveContactAuthorized: { type: boolean }
        proactiveContactEligible: { type: boolean }
        _links: { $ref: '#/components/schemas/Links' }
    CustomerSummary:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
    PagedCustomers:
      type: object
      required: [_embedded, page, _links]
      properties:
        _embedded:
          type: object
          required: [customers]
          properties:
            customers:
              type: array
              items: { $ref: '#/components/schemas/CustomerRepresentation' }
        page: { $ref: '#/components/schemas/PageMetadata' }
        _links: { $ref: '#/components/schemas/Links' }

    CategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    CategoryRepresentation:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [_links]
          properties:
            _links: { $ref: '#/components/schemas/Links' }
    CategoryCollection:
      type: object
      required: [_embedded, _links]
      properties:
        _embedded:
          type: object
          required: [categories]
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/CategoryRepresentation' }
        _links: { $ref: '#/components/schemas/Links' }

    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [name, description, categoryId, status, primaryImageIndex]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProductStatus' }
        primaryImageIndex: { type: integer, minimum: 0 }
    ProductReplaceRequest:
      type: object
      additionalProperties: false
      required: [name, description, categoryId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        categoryId: { type: string, format: uuid }
    ProductStatusPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProductStatus' }
    ProductImagePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        primary: { type: boolean, description: Somente true é aceito para trocar a principal }
        displayOrder: { type: integer, minimum: 0 }
    ProductImageRepresentation:
      type: object
      required: [id, url, primary, displayOrder, _links]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        primary: { type: boolean }
        displayOrder: { type: integer }
        _links: { $ref: '#/components/schemas/Links' }
    ProductRepresentation:
      type: object
      required: [id, name, description, category, status, images, _links]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/CategorySummary' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        images:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProductImageRepresentation' }
        _links: { $ref: '#/components/schemas/Links' }
    PagedProducts:
      type: object
      required: [_embedded, page, _links]
      properties:
        _embedded:
          type: object
          required: [products]
          properties:
            products:
              type: array
              items: { $ref: '#/components/schemas/ProductRepresentation' }
        page: { $ref: '#/components/schemas/PageMetadata' }
        _links: { $ref: '#/components/schemas/Links' }

    InterestRepresentation:
      type: object
      required: [id, customerId, product, createdAt, whatsappUrl, _links]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductRepresentation' }
        createdAt: { type: string, format: date-time }
        whatsappUrl: { type: string, format: uri }
        _links: { $ref: '#/components/schemas/Links' }
    PagedInterests:
      type: object
      required: [_embedded, page, _links]
      properties:
        _embedded:
          type: object
          required: [interests]
          properties:
            interests:
              type: array
              items: { $ref: '#/components/schemas/InterestRepresentation' }
        page: { $ref: '#/components/schemas/PageMetadata' }
        _links: { $ref: '#/components/schemas/Links' }

    ManualContactRequest:
      type: object
      additionalProperties: false
      required: [occurredAt, channel, description]
      properties:
        occurredAt: { type: string, format: date-time }
        channel: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 1, maxLength: 2000 }
    CompleteContactRecordRequest:
      type: object
      additionalProperties: false
      required: [status, occurredAt, channel, description]
      properties:
        status: { type: string, const: COMPLETED }
        occurredAt: { type: string, format: date-time }
        channel: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 1, maxLength: 2000 }
    ContactRecordRepresentation:
      type: object
      required: [id, customerId, status, channel, createdAt, _links]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        interestId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/FollowUpStatus' }
        occurredAt: { type: [string, 'null'], format: date-time }
        channel: { type: string }
        description: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        _links: { $ref: '#/components/schemas/Links' }
    PagedContactRecords:
      type: object
      required: [_embedded, page, _links]
      properties:
        _embedded:
          type: object
          required: [contactRecords]
          properties:
            contactRecords:
              type: array
              items: { $ref: '#/components/schemas/ContactRecordRepresentation' }
        page: { $ref: '#/components/schemas/PageMetadata' }
        _links: { $ref: '#/components/schemas/Links' }

    ReminderRepresentation:
      type: object
      required: [id, interestId, customer, customerCode, product, channel, dueAt, status, overdue, _links]
      properties:
        id: { type: string, format: uuid }
        interestId: { type: string, format: uuid }
        customer: { $ref: '#/components/schemas/CustomerSummary' }
        customerCode: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/ProductRepresentation' }
        channel: { type: string, const: WHATSAPP }
        description: { type: string }
        dueAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/FollowUpStatus' }
        overdue: { type: boolean }
        completedAt: { type: [string, 'null'], format: date-time }
        _links: { $ref: '#/components/schemas/Links' }
    PagedReminders:
      type: object
      required: [_embedded, page, _links]
      properties:
        _embedded:
          type: object
          required: [reminders]
          properties:
            reminders:
              type: array
              items: { $ref: '#/components/schemas/ReminderRepresentation' }
        page: { $ref: '#/components/schemas/PageMetadata' }
        _links: { $ref: '#/components/schemas/Links' }

    ApiErrorResponse:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z]+_[0-9]{3}$' }
        message: { type: string }
        path: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
