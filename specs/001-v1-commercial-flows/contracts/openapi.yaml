openapi: 3.1.0
info:
  title: Laumiley Modas API
  version: 1.0.0
  description: >-
    Contrato REST da operação comercial V1. Toda operação pode retornar HTTP 500 com
    ApiErrorResponse, código INTERNAL_001 e mensagem genérica, sem detalhes internos.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Catalog
  - name: Customer
  - name: Admin Catalog
  - name: Admin CRM

paths:
  /auth/customers:
    post:
      tags: [Auth]
      summary: Cadastra uma conta de cliente
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Cliente cadastrado; consentimento proativo inicia negado
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica cliente por e-mail e senha
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token emitido e refresh token configurado em cookie seguro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/google/client:
    get:
      tags: [Auth]
      summary: Inicia cadastro ou login Google de cliente
      operationId: beginGoogleClientLogin
      responses:
        '302':
          description: Redirecionamento para o Google com state e nonce protegidos

  /auth/google/admin:
    get:
      tags: [Auth]
      summary: Inicia login Google da única conta administrativa autorizada
      operationId: beginGoogleAdminLogin
      responses:
        '302':
          description: Redirecionamento para o Google com intenção administrativa protegida no state

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Conclui o fluxo Google iniciado para cliente ou administradora
      operationId: completeGoogleLogin
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account local autenticado; refresh token configurado em cookie seguro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '202':
          description: Novo cliente Google deve completar os dados obrigatórios antes de receber tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleRegistrationRequired' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/google/customers:
    post:
      tags: [Auth]
      summary: Completa o cadastro de um novo cliente autenticado pelo Google
      operationId: completeGoogleCustomerRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCustomerRegistrationRequest' }
      responses:
        '201':
          description: Account e Customer criados; refresh token configurado em cookie seguro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotaciona o refresh token e emite novo access token
      operationId: refreshAccessToken
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Novo par emitido; o refresh token anterior não pode ser reutilizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoga a família do refresh token atual
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        '204': { description: Refresh tokens revogados e cookie removido }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna a conta autenticada
      operationId: getCurrentAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccount'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /catalog/products:
    get:
      tags: [Catalog]
      summary: Lista produtos ativos do catálogo público
      operationId: listCatalogProducts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de produtos; items pode ser vazio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /catalog/products/{productId}:
    get:
      tags: [Catalog]
      summary: Consulta os detalhes de um produto ativo
      operationId: getCatalogProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produto ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404': { $ref: '#/components/responses/NotFound' }

  /customers/me/proactive-contact-consent:
    get:
      tags: [Customer]
      summary: Consulta a autorização atual para contatos proativos
      operationId: getMyContactConsent
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Customer]
      summary: Concede ou retira autorização para contatos proativos
      operationId: setMyContactConsent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorized]
              properties:
                authorized: { type: boolean }
      responses:
        '200':
          description: Estado atualizado; a operação é idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactConsent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{productId}/interests:
    post:
      tags: [Customer]
      summary: Registra interesse e gera o contexto do WhatsApp
      operationId: registerProductInterest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Interesse criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResult'
        '200':
          description: Repetição idempotente; resultado existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/me/interests/{interestId}/whatsapp-link:
    get:
      tags: [Customer]
      summary: Recupera o link do WhatsApp de um interesse próprio
      operationId: getInterestWhatsappLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InterestId'
      responses:
        '200':
          description: Contexto recuperado sem criar outro interesse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsappLink'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/categories:
    get:
      tags: [Admin Catalog]
      summary: Lista categorias administrativas
      operationId: listAdminCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Catalog]
      summary: Cadastra uma categoria
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{categoryId}:
    patch:
      tags: [Admin Catalog]
      summary: Renomeia uma categoria
      operationId: renameCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products:
    get:
      tags: [Admin Catalog]
      summary: Lista produtos ativos e inativos
      operationId: listAdminProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página administrativa de produtos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Catalog]
      summary: Cria produto completo com imagens
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [product, images]
              properties:
                product: { $ref: '#/components/schemas/ProductCreateInput' }
                images:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
            encoding:
              product: { contentType: application/json }
      responses:
        '201':
          description: Produto e referências de imagem criados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ExternalUnavailable' }

  /admin/products/{productId}:
    get:
      tags: [Admin Catalog]
      summary: Consulta um produto para administração
      operationId: getAdminProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produto ativo ou inativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin Catalog]
      summary: Altera dados descritivos e categoria do produto
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateInput' }
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/products/{productId}/status:
    put:
      tags: [Admin Catalog]
      summary: Ativa ou inativa um produto
      operationId: setProductStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ProductStatus' }
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/products/{productId}/images:
    post:
      tags: [Admin Catalog]
      summary: Adiciona imagens a um produto
      operationId: addProductImages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                primaryImageIndex:
                  type: integer
                  minimum: 0
                  description: Opcional; torna a imagem adicionada nessa posição a principal.
                images:
                  type: array
                  minItems: 1
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Imagens adicionadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ExternalUnavailable' }

  /admin/products/{productId}/images/{imageId}/primary:
    put:
      tags: [Admin Catalog]
      summary: Define a imagem principal do produto
      operationId: setPrimaryProductImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: Imagem principal definida; operação idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/products/{productId}/images/{imageId}:
    delete:
      tags: [Admin Catalog]
      summary: Remove uma imagem sem quebrar as invariantes do produto
      operationId: removeProductImage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/ImageId'
        - name: replacementPrimaryImageId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Obrigatório quando a imagem removida é a principal.
      responses:
        '204': { description: Referência removida e limpeza externa iniciada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/customers:
    get:
      tags: [Admin CRM]
      summary: Pesquisa clientes por nome, e-mail ou telefone
      operationId: searchCustomers
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/customers/{customerId}:
    get:
      tags: [Admin CRM]
      summary: Consulta o contexto comercial de um cliente
      operationId: getCustomerContext
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Contexto do cliente e consentimento vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/customers/{customerId}/interests:
    get:
      tags: [Admin CRM]
      summary: Lista interesses do cliente
      operationId: listCustomerInterests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Interesses mais recentes primeiro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/customers/{customerId}/contacts:
    get:
      tags: [Admin CRM]
      summary: Lista registros de contato pendentes e concluídos
      operationId: listCustomerContacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Registros distinguem status pendente e concluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin CRM]
      summary: Registra um contato já realizado
      operationId: recordContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactInput' }
      responses:
        '201':
          description: Contato registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/contacts/{contactId}/complete:
    post:
      tags: [Admin CRM]
      summary: Completa um contato pendente e conclui seu lembrete automático
      operationId: completePendingContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCompletionInput' }
      responses:
        '200':
          description: Contato e lembrete concluídos atomicamente; repetição é idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactCompletionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/customers/{customerId}/reminders:
    get:
      tags: [Admin CRM]
      summary: Lista lembretes de um cliente
      operationId: listCustomerReminders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lembretes do cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin CRM]
      summary: Cria um lembrete manual
      operationId: createReminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderInput' }
      responses:
        '201':
          description: Lembrete criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reminders:
    get:
      tags: [Admin CRM]
      summary: Lista lembretes pendentes para acompanhamento
      operationId: listPendingReminders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Pendentes ordenados pela data prevista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reminders/{reminderId}/complete:
    post:
      tags: [Admin CRM]
      summary: Conclui um lembrete criado manualmente
      operationId: completeManualReminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReminderId'
      responses:
        '200':
          description: Lembrete concluído; repetição é idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reminder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: LAUMILEY_REFRESH

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InterestId:
      name: interestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContactId:
      name: contactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }

  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Unauthorized:
      description: Autenticação ausente ou inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Forbidden:
      description: Papel sem permissão para a operação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    NotFound:
      description: Recurso inexistente ou não visível ao solicitante
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    Conflict:
      description: Duplicidade, idempotência reutilizada ou conflito de estado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    UnprocessableEntity:
      description: Regra de domínio impede a operação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    PayloadTooLarge:
      description: Arquivo maior que o limite configurado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    UnsupportedMediaType:
      description: Tipo de arquivo não permitido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    ExternalUnavailable:
      description: Armazenamento de mídia indisponível sem alteração parcial publicada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    TooManyRequests:
      description: Limite temporário de tentativas atingido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }
    InternalServerError:
      description: Falha inesperada sem exposição de detalhes internos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiErrorResponse' }

  schemas:
    RegisterCustomerRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, password, whatsappPhone]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 8
          maxLength: 64
          writeOnly: true
          description: Máximo adicional de 72 bytes após codificação UTF-8.
        whatsappPhone: { type: string, maxLength: 20, description: Número normalizável para E.164. }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: Máximo adicional de 72 bytes após codificação UTF-8.
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, account]
      properties:
        accessToken:
          type: string
          description: JWT próprio da aplicação; o refresh JWT é enviado somente em cookie HttpOnly.
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Segundos restantes do access token. }
        account: { $ref: '#/components/schemas/CurrentAccount' }
    GoogleRegistrationRequired:
      type: object
      required: [registrationToken, email, expiresIn]
      properties:
        registrationToken:
          type: string
          description: Credencial curta que permite apenas completar o cadastro CLIENT.
        email: { type: string, format: email }
        givenName: { type: [string, 'null'] }
        familyName: { type: [string, 'null'] }
        expiresIn: { type: integer, description: Segundos restantes para completar o cadastro. }
    GoogleCustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationToken, firstName, lastName, whatsappPhone]
      properties:
        registrationToken: { type: string, writeOnly: true }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        whatsappPhone: { type: string, maxLength: 20, description: Número normalizável para E.164. }
    CurrentAccount:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [CLIENT, ADMIN] }
        customerId: { type: [string, 'null'], format: uuid }
    ContactConsent:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean }
        changedAt: { type: [string, 'null'], format: date-time }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ProductImage:
      type: object
      description: Referência pública da imagem; o externalId do provedor permanece interno.
      required: [id, url, primary, displayOrder]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        primary: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    ProductSummary:
      type: object
      required: [id, name, description, category, mainImage, images]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        mainImage: { $ref: '#/components/schemas/ProductImage' }
        images:
          type: array
          minItems: 1
          description: URLs de todas as imagens do produto em ordem de exibição.
          items: { $ref: '#/components/schemas/ProductImage' }
    ProductDetail:
      $ref: '#/components/schemas/ProductSummary'
    ProductCreateInput:
      type: object
      additionalProperties: false
      required: [name, description, categoryId, status, primaryImageIndex]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        categoryId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ProductStatus' }
        primaryImageIndex: { type: integer, minimum: 0 }
    ProductUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        categoryId: { type: string, format: uuid }
    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductDetail'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/ProductStatus' }
    InterestResult:
      type: object
      required: [interestId, product, createdAt, whatsappUrl]
      properties:
        interestId: { type: string, format: uuid }
        product:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        whatsappUrl: { type: string, format: uri }
    WhatsappLink:
      type: object
      required: [interestId, whatsappUrl]
      properties:
        interestId: { type: string, format: uuid }
        whatsappUrl: { type: string, format: uri }
    CustomerSummary:
      type: object
      required: [id, firstName, lastName, email, whatsappPhone, proactiveContactAuthorized]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        whatsappPhone: { type: string }
        proactiveContactAuthorized: { type: boolean }
    CustomerContext:
      allOf:
        - $ref: '#/components/schemas/CustomerSummary'
        - type: object
          properties:
            contactConsentChangedAt: { type: [string, 'null'], format: date-time }
    CustomerReference:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid, description: Código único do cliente. }
        displayName: { type: string }
    ProductReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ContactInput:
      type: object
      additionalProperties: false
      required: [occurredAt, channel, description]
      properties:
        occurredAt: { type: string, format: date-time }
        channel: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 2000 }
    ContactCompletionInput:
      type: object
      additionalProperties: false
      required: [occurredAt, description]
      properties:
        occurredAt: { type: string, format: date-time }
        description: { type: string, minLength: 1, maxLength: 2000 }
    Contact:
      type: object
      required: [id, customerId, status, channel, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        interestId: { type: [string, 'null'], format: uuid }
        reminderId: { type: [string, 'null'], format: uuid }
        product:
          anyOf:
            - $ref: '#/components/schemas/ProductReference'
            - type: 'null'
        status: { type: string, enum: [PENDING, COMPLETED] }
        occurredAt: { type: [string, 'null'], format: date-time }
        channel: { type: string }
        description: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ReminderInput:
      type: object
      additionalProperties: false
      required: [description, dueAt, purpose]
      properties:
        description: { type: string, minLength: 1, maxLength: 1000 }
        dueAt: { type: string, format: date-time }
        purpose: { type: string, enum: [PROACTIVE_CONTACT, CUSTOMER_REQUEST_FOLLOW_UP] }
    Reminder:
      allOf:
        - $ref: '#/components/schemas/ReminderInput'
        - type: object
          required: [id, customerId, customer, origin, status, overdue, actionable, createdAt]
          properties:
            id: { type: string, format: uuid }
            customerId: { type: string, format: uuid }
            customer: { $ref: '#/components/schemas/CustomerReference' }
            origin: { type: string, enum: [MANUAL, INTEREST] }
            interestId: { type: [string, 'null'], format: uuid }
            contactRecordId: { type: [string, 'null'], format: uuid }
            product:
              anyOf:
                - $ref: '#/components/schemas/ProductReference'
                - type: 'null'
            channel: { type: [string, 'null'], description: WhatsApp no acompanhamento automático. }
            status: { type: string, enum: [PENDING, COMPLETED] }
            overdue: { type: boolean, readOnly: true }
            actionable: { type: boolean, readOnly: true }
            completedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
    ContactCompletionResult:
      type: object
      required: [contact, reminder]
      properties:
        contact: { $ref: '#/components/schemas/Contact' }
        reminder: { $ref: '#/components/schemas/Reminder' }
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
    AdminProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminProductDetail' } }
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CustomerSummary' } }
    InterestPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/InterestResult' } }
    ContactPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Contact' } }
    ReminderPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string, example: VALIDATION_001 }
        message: { type: string }
    ApiErrorResponse:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string, example: CATALOG_001 }
        message: { type: string }
        path: { type: string }
        traceId: { type: [string, 'null'] }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
